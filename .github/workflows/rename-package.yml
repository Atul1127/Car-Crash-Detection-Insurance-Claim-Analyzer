name: Rename internal package

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename package and imports
        shell: bash
        run: |
          set -e
          if [ ! -d "claimvision" ]; then
            echo "No claimvision package found; nothing to rename."
            exit 0
          fi

          git mv claimvision car_crash_claim_analyzer

          find . -type f \( -name '*.py' -o -name '*.md' -o -name '*.txt' \) -not -path './.git/*' -print0 \
            | xargs -0 sed -i \
              -e 's/claimvision/car_crash_claim_analyzer/g' \
              -e 's/ClaimVisionPipeline/CarCrashClaimAnalyzerPipeline/g' \
              -e 's/ClaimVision AI/Car Crash Claim Analyzer/g' \
              -e 's/ClaimVision/Car Crash Claim Analyzer/g'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove ClaimVision package naming"
          git push
